<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9EDF0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1C1F" media="(prefers-color-scheme: dark)">
<script>try{var d=document.documentElement,t=localStorage.getItem('theme');if(t&&t!=='auto')d.dataset.theme=t;d.dataset.tone=localStorage.getItem('tone')||'cool';d.dataset.accent=localStorage.getItem('accent')||'copper';d.dataset.density=localStorage.getItem('density')||'comfy';var z=+(localStorage.getItem('uisize')||100)/100;if(z!==1)d.style.zoom=z;}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Astera</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="shell">
  <aside class="rail" aria-label="Ana menü">
    <a class="brand" href="#/" aria-label="Ana sayfa">
      <span class="brand-mark" id="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="brand-text"><span class="brand-name" id="brand-name">Astera</span><span class="brand-tag" id="brand-tag">Management</span></span>
    </a>
    <nav class="nav" id="nav"></nav>
    <a class="nav-item settings-link" href="#/ayarlar" data-route="ayarlar">
      <svg><use href="#i-gear"/></svg><span>Ayarlar</span>
    </a>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1 id="page-title">Pano</h1>
      <div class="pbar" id="pbar" role="status" aria-label="Yazıcı durumları" hidden></div>
      <div class="topbar-actions">
        <button class="icon-btn cmdk-btn" id="cmdk-btn" aria-label="Ara (Ctrl+K)" title="Ara ve hızlı işlem (Ctrl+K)"><svg><use href="#i-search"/></svg><kbd>Ctrl K</kbd></button>
        <button class="icon-btn notif-bell" id="notif-bell" aria-label="Bildirimler"><svg><use href="#i-bell"/></svg><span class="nb-count" id="nb-count" hidden></span></button>
        <a class="icon-btn only-mobile" href="#/ayarlar" aria-label="Ayarlar"><svg><use href="#i-gear"/></svg></a>
        <button class="btn btn-primary new-print-btn" id="new-print-top">
          <svg><use href="#i-plus"/></svg><span>Yeni baskı</span>
        </button>
      </div>
    </header>
    <div id="view" class="view"></div>
  </main>
  <aside class="notif-panel" id="notif-panel" aria-label="Bildirimler"></aside>
</div>
<div class="notif-scrim" id="notif-scrim"></div>

<button class="fab" id="new-print-fab" aria-label="Yeni baskı"><svg><use href="#i-plus"/></svg></button>
<nav class="tabbar" id="tabbar" aria-label="Alt menü"></nav>

<div id="modal-root"></div>
<div id="toasts" aria-live="polite"></div>
